spring.application.name=chatConnectSpring

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:dev_secret_key_super_segura_para_testes_locais_123456}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.endpoint=${AWS_S3_ENDPOINT:${SQS_ENDPOINT:http://localstack:4566}}
aws.s3.public-endpoint=${AWS_S3_PUBLIC_ENDPOINT:http://localhost:4566}

spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

spring.cloud.aws.endpoint=${SQS_ENDPOINT}

spring.cloud.aws.s3.path-style-access-enabled=true

auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.path=${AUTH_COOKIE_PATH:/api/auth}

frontend.url=${FRONTEND_URL:http://localhost:3000}

auth.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:15}

auth.mail.from=${MAIL_FROM:no-reply@chatconnect.local}

spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

outbox.s3-cleanup.interval-ms=600000
outbox.s3-cleanup.batch-size=50
outbox.s3-cleanup.retention-days=7
outbox.s3-cleanup.max-attempts=5

logging.level.com.example.chatConnectSpring=DEBUG
logging.level.com.example.chatConnectSpring.friendship.application.listeners=DEBUG
logging.level.com.example.chatConnectSpring.chat.infrastructure.adapters.in.messaging=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n
